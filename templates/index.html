<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tài Xỉu Ultra V3</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<div class="app">

  <!-- ====== ĐĂNG NHẬP ====== -->
  <section id="login-panel" class="card">
    <h1>🤖 AI TÀI XỈU <span>V3</span></h1>
    <p class="sub">35 Lõi Trí Tuệ · Exponential Weights</p>
    <input id="username" placeholder="Tài khoản game" autocomplete="username">
    <input id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password">
    <button id="btn-login">🚀 Đăng nhập</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <!-- ====== DASHBOARD ====== -->
  <section id="dashboard" class="hidden">
    <header class="topbar">
      <div class="user">
        <span class="dot"></span>
        <div>
          <b id="nickname">-</b>
          <div class="uname" id="uname-sub">-</div>
        </div>
      </div>
      <div class="bal-wrap">
        <div class="bal-label">Số dư</div>
        <div class="bal">💰 <span id="balance">0</span> Win</div>
      </div>
    </header>

    <!-- Thống kê nhanh -->
    <div class="grid">
      <div class="card stat">
        <div class="label">Phiên hiện tại</div>
        <div class="val" id="session">-</div>
      </div>
      <div class="card stat">
        <div class="label">AI Dự đoán</div>
        <div class="val" id="prediction">--</div>
      </div>
      <div class="card stat">
        <div class="label">Lãi / Lỗ</div>
        <div class="val" id="pl">0</div>
      </div>
      <div class="card stat">
        <div class="label">Chuỗi thắng</div>
        <div class="val" id="streak">0</div>
      </div>
    </div>

    <!-- Thống kê tổng -->
    <div class="card stats-total">
      <h3>📊 Thống kê tổng</h3>
      <div class="stats-row">
        <div><span class="s-win" id="total-win">0</span><label>Thắng</label></div>
        <div><span class="s-lose" id="total-lose">0</span><label>Thua</label></div>
        <div><span class="s-total" id="total-sessions">0</span><label>Tổng phiên</label></div>
        <div><span class="s-rate" id="win-rate">0%</span><label>Tỷ lệ</label></div>
      </div>
    </div>

    <!-- Cài đặt cược -->
    <div class="card">
      <h3>⚙️ Cài đặt cược</h3>
      <label>Tiền cược gốc (Win)</label>
      <input id="base-bet" type="number" value="10000" step="1000" min="1000">
      <label>Mục tiêu chốt lãi (tùy chọn)</label>
      <input id="target" type="number" placeholder="VD: 500000">

      <div class="row">
        <button id="btn-autobet" class="toggle">▶ Bật Auto Cược</button>
        <button id="btn-x2" class="toggle">⚡ X2 Cầu Thông</button>
      </div>
      <button id="btn-start" class="primary">🎯 Bắt đầu chạy Bot</button>
      <button id="btn-stop" class="danger">⏹ Dừng Bot</button>
    </div>

    <!-- Lịch sử -->
    <div class="card">
      <div class="head-row">
        <h3>📜 Lịch sử thắng / thua</h3>
        <button id="btn-reset" class="small danger">🗑 Reset lịch sử</button>
      </div>
      <div id="history-list" class="history-list">
        <div class="empty">Chưa có lịch sử cược</div>
      </div>
    </div>

    <!-- Log -->
    <div class="card">
      <h3>📡 Log hoạt động</h3>
      <div id="log" class="log"></div>
    </div>

    <!-- Top AI -->
    <div class="card">
      <div class="head-row">
        <h3>AI</h3>
        <button id="btn-weights" class="small">🔄 Làm mới</button>
      </div>
      <div id="weights" class="weights"></div>
    </div>
  </section>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
