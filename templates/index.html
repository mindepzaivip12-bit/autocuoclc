<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TOOL AUTO LC79</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<div class="app">

  <!-- MÀN HÌNH ĐĂNG NHẬP -->
  <section id="login-panel">
    <div class="header-banner">
      <div class="logo-79">LC79</div>
      <div class="header-text">
        <h1>TOOL AUTO LC79</h1>
        <p>Hệ thống phân tích cầu & dự đoán Tài Xỉu tự động</p>
      </div>
    </div>

    <div class="login-card">
      <div class="card-title">
        <span class="icon">➜]</span> ĐĂNG NHẬP GAME
      </div>
      
      <div class="input-group">
        <label>TÀI KHOẢN</label>
        <input id="username" placeholder="username" autocomplete="username">
      </div>
      
      <div class="input-group">
        <label>MẬT KHẨU</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div class="input-group">
        <label>NHẬP KEY BẢN QUYỀN</label>
        <input id="license-key" placeholder="KEY-XXXXX">
      </div>

      <button id="btn-login" class="btn-primary">
        <span class="lock-icon">🔒</span> ĐĂNG NHẬP
      </button>
      <p id="login-msg" class="msg"></p>
    </div>
  </section>

  <!-- MÀN HÌNH DASHBOARD (ẨN LÚC ĐẦU) -->
  <section id="dashboard" class="hidden">
    <header class="topbar">
      <div class="user">
        <div class="avatar">👤</div>
        <div class="user-info">
          <b id="nickname">-</b>
          <div class="uname" id="uname-sub">-</div>
        </div>
      </div>
      <div class="bal-wrap">
        <div class="bal-label">Số dư</div>
        <div class="bal">💰 <span id="balance">0</span></div>
      </div>
    </header>

    <div class="status-bar">
      <div class="st-item">
        <div class="st-label">Phiên</div>
        <div class="st-val" id="session">-</div>
      </div>
      <div class="st-item">
        <div class="st-label">AI Dự đoán</div>
        <div class="st-val" id="prediction">--</div>
      </div>
      <div class="st-item">
        <div class="st-label">Lãi / Lỗ</div>
        <div class="st-val" id="pl">0</div>
      </div>
      <div class="st-item">
        <div class="st-label">Chuỗi</div>
        <div class="st-val" id="streak">0</div>
      </div>
    </div>

    <div class="card">
      <h3>📊 Thống kê tổng</h3>
      <div class="stats-grid">
        <div class="stat-cell win"><span id="total-win">0</span><label>Thắng</label></div>
        <div class="stat-cell lose"><span id="total-lose">0</span><label>Thua</label></div>
        <div class="stat-cell total"><span id="total-sessions">0</span><label>Tổng phiên</label></div>
        <div class="stat-cell rate"><span id="win-rate">0%</span><label>Tỷ lệ</label></div>
      </div>
    </div>

    <div class="card">
      <h3>⚙️ Cài đặt cược</h3>
      <div class="input-group">
        <label>Tiền cược gốc (Win)</label>
        <input id="base-bet" type="number" value="10000" step="1000" min="1000">
      </div>
      <div class="input-group">
        <label>Mục tiêu chốt lãi (tùy chọn)</label>
        <input id="target" type="number" placeholder="VD: 500000">
      </div>

      <div class="btn-row">
        <button id="btn-autobet" class="toggle">▶ Bật Auto</button>
        <button id="btn-x2" class="toggle">⚡ X2</button>
      </div>
      <button id="btn-start" class="btn-primary" style="background: linear-gradient(135deg, #22c55e, #16a34a);">🎯 Bắt đầu Bot</button>
      <button id="btn-stop" class="btn-danger">⏹ Dừng Bot</button>
    </div>

    <div class="card">
      <div class="head-row">
        <h3>📜 Lịch sử thắng/thua</h3>
        <button id="btn-reset" class="btn-small danger">🗑 Reset</button>
      </div>
      <div id="history-list" class="history-list">
        <div class="empty">Chưa có lịch sử cược</div>
      </div>
    </div>

    <div class="card">
      <h3>📡 Log hoạt động</h3>
      <div id="log" class="log"></div>
    </div>

    <div class="card">
      <div class="head-row">
        <h3>🧠 Top 15 Core AI</h3>
        <button id="btn-weights" class="btn-small">🔄 Làm mới</button>
      </div>
      <div id="weights" class="weights"></div>
    </div>
  </section>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
